version: '3.8'

services:
  # 1. Web 服务器 (Nginx - 包含火鸟伪静态与静态资源分发)
  nginx:
    platform: linux/amd64
    image: nginx:alpine
    container_name: firebird-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:80"
    volumes:
      - ./webroot:/var/www/html/webroot
      - ./deploy/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/dev/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
    networks:
      - firebird-net

  # 2. PHP 运行环境 (PHP 7.4-FPM + mysqli + gd + redis)
  php:
    platform: linux/amd64
    build:
      # context 提到仓库根：Dockerfile 需 COPY webroot/huoniao.so（火鸟加密内核 loader）
      context: .
      dockerfile: deploy/dev/php/Dockerfile
    container_name: firebird-php
    restart: unless-stopped
    environment:
      # 本地 dev 用 secret（api/fbs HMAC 网关）。生产值在 K8s Secret（见 values.yaml 注释），勿与生产共用
      FBS_GATEWAY_SECRET: "2830cb71aba8ae97717b6ca308add9fb82734a8cfe98773e"
    volumes:
      - ./webroot:/var/www/html/webroot
    depends_on:
      - mysql
      - redis
    networks:
      - firebird-net

  # 3. MySQL 数据库 (兼容火鸟 SQL 语法的 MySQL 5.7 / MariaDB 10.5)
  mysql:
    platform: linux/amd64
    image: mariadb:10.5
    container_name: firebird-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: firebird_ph
      MYSQL_USER: firebird
      MYSQL_PASSWORD: firebirdpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - firebird-net

  # 4. Redis 缓存与会话
  redis:
    platform: linux/amd64
    image: redis:7-alpine
    container_name: firebird-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - firebird-net

  # 5. n8n 自动化任务引擎 (一人团队工作流核心)
  n8n:
    platform: linux/amd64
    image: n8nio/n8n:latest
    container_name: firebird-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Manila
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - firebird-net

  # 6. Telegram Bot 前哨服务 (Zero-Dep Native Node.js)
  tg-bot:
    platform: linux/amd64
    image: node:20-alpine
    container_name: firebird-tg-bot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    command: ["node", "services/tg-bot/src/server.js"]
    ports:
      - "3001:3001"
    environment:
      - TG_BOT_PORT=3001
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/tg-input
    depends_on:
      - n8n
    networks:
      - firebird-net

  # 7. USDT 付款监听器 (独立服务：单实例，无对外端口，只出站轮询 TronGrid)
  payment-listener:
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.payment-listener
    container_name: firebird-payment-listener
    restart: unless-stopped
    profiles: [payment]  # 默认栈不启动；docker compose --profile payment up
    deploy:
      replicas: 1
    environment:
      # 缺失时由监听器启动自检失败，不阻塞其他服务的 compose 解析
      - TRON_MASTER_RECEIVE_ADDRESS=${TRON_MASTER_RECEIVE_ADDRESS:-}
      - TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      # 回调目标（回调尚未启用，见 docs/internal/GATEWAY_SPIKE.md）
      - API_BASE_URL=${API_BASE_URL:-}
    networks:
      - firebird-net

networks:
  firebird-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  n8n_data:
