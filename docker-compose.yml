version: '3.8'

services:
  # 1. Web 服务器 (Nginx - 包含火鸟伪静态与静态资源分发)
  nginx:
    image: nginx:alpine
    container_name: firebird-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./webroot:/var/www/html/webroot
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - firebird-net

  # 2. PHP 运行环境 (PHP 7.4-FPM + mysqli + gd + redis)
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: firebird-php
    restart: unless-stopped
    volumes:
      - ./webroot:/var/www/html/webroot
    depends_on:
      - mysql
      - redis
    networks:
      - firebird-net

  # 3. MySQL 数据库 (兼容火鸟 SQL 语法的 MySQL 5.7 / MariaDB 10.5)
  mysql:
    image: mariadb:10.5
    container_name: firebird-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: firebird_ph
      MYSQL_USER: firebird
      MYSQL_PASSWORD: firebirdpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - firebird-net

  # 4. Redis 缓存与会话
  redis:
    image: redis:7-alpine
    container_name: firebird-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - firebird-net

  # 5. n8n 自动化任务引擎 (一人团队工作流核心)
  n8n:
    image: n8nio/n8n:latest
    container_name: firebird-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Manila
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - firebird-net

networks:
  firebird-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  n8n_data:
