# ==============================================================================
# 菲律宾宿务分站 (Cebu Subsite) Helm Values
# ==============================================================================

replicaCount: 1

site:
  cityCode: "cebu"
  cityName: "Cebu City (宿务分站)"
  currency: "PHP"
  domain: "cebu.fh580.net"

ingress:
  enabled: true
  hosts:
    - host: cebu.fh580.net
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
