# ==============================================================================
# 菲律宾宿务分站 (Cebu Subsite) Helm Values
# ==============================================================================

replicaCount: 2

site:
  cityCode: "cebu"
  cityName: "Cebu City (宿务分站)"
  currency: "PHP"
  domain: "cebu.fh580.net"

ingress:
  enabled: true
  hosts:
    - host: cebu.fh580.net
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# 最低可用 Pod 数为 1，确保更新与升级时绝不报 500
pdb:
  enabled: true
  minAvailable: 1

# 附件走 GCS（siteConfig ftpType=3 + firebird-storage-secret），本地 uploads/ 只是上传中转，不再需要 PVC。
# 2026-10-10 核查：canary PVC 0 文件、manila PVC 0MiB/11 inodes（均为空），无需迁移。
# 去 PVC 后：Deployment 自动 RollingUpdate(maxUnavailable=0)，发版/节点轮换不再整站不可用。
# 如需恢复本地附件持久化：uploads.enabled=true（RWO → 回到 Recreate 且单副本）。
uploads:
  enabled: false

