# ==============================================================================
# 菲律宾宿务分站 (Cebu Subsite) Helm Values
# ==============================================================================

replicaCount: 1

site:
  cityCode: "cebu"
  cityName: "Cebu City (宿务分站)"
  currency: "PHP"
  domain: "cebu.fh580.net"

ingress:
  enabled: true
  hosts:
    - host: cebu.fh580.net
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# 最低可用 Pod 数为 1，确保更新与升级时绝不报 500
pdb:
  enabled: true
  minAvailable: 1

# AD-17: 上传文件 PVC（RWO → Recreate 发布、单副本；改 RWX 存储类后可滚动/HPA）
uploads:
  enabled: true
  storageClass: "standard-rwo"
  size: "10Gi"
  accessMode: "ReadWriteOnce"

