apiVersion: apps/v1
kind: Deployment
metadata:
  name: firebird-{{ .Values.siteId }}
  labels:
    app: firebird-site
    site: {{ .Values.siteId }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # 更新时不可用 Pod 数必须为 0，保证业务不中断
      maxSurge: 1           # 允许额外拉起 1 个新 Pod 完成平滑交接
  selector:
    matchLabels:
      app: firebird-site
      site: {{ .Values.siteId }}
  template:
    metadata:
      labels:
        app: firebird-site
        site: {{ .Values.siteId }}
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        # Init: 从 firebird-php 镜像同步源码至共享卷，同时通过丝滑过渡引擎保护持久化配置
        - name: init-webroot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "sh"
            - "-c"
            - |
              cp -a /var/www/html/. /shared/ && chmod -R 777 /shared/data 2>/dev/null || true
              if [ -d /config-pvc ]; then
                if [ -f /config-pvc/siteConfig.inc.php ]; then
                  echo ">>> [Transition Engine] 恢复 PVC 中保存的自定义运行配置..."
                  cp -af /config-pvc/*.inc.php /shared/include/config/ 2>/dev/null || true
                else
                  echo ">>> [Transition Engine] 首次挂载 PVC，将镜像基线配置作为种子保存到 PVC..."
                  cp -an /shared/include/config/*.inc.php /config-pvc/ 2>/dev/null || true
                fi
                chmod -R 777 /config-pvc 2>/dev/null || true
              fi
              # AD-17: 附件目录在独立 PVC 上，Pod 重建后文件仍在
              if [ -d /uploads-pvc ]; then
                chown -R www-data:www-data /uploads-pvc 2>/dev/null || chmod -R 777 /uploads-pvc 2>/dev/null || true
              fi
          volumeMounts:
            - name: webroot-shared
              mountPath: /shared
            {{- if .Values.persistence.enabled }}
            - name: config-persistent
              mountPath: /config-pvc
            {{- end }}
            {{- if .Values.uploads.enabled }}
            - name: uploads-persistent
              mountPath: /uploads-pvc
            {{- end }}

      containers:
        # Container 1: PHP-FPM 处理引擎
        - name: php-fpm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              value: "{{ .Values.database.host }}"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            - name: DB_USER
              value: "{{ .Values.database.user | default "firebird_user" }}"
            {{- if .Values.database.passwordSecretRef }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretRef }}
                  key: {{ .Values.database.passwordSecretKey | default "password" }}
            {{- else if .Values.database.password }}
            - name: DB_PASS
              value: "{{ .Values.database.password }}"
            {{- end }}
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"
            - name: REDIS_PORT
              value: "{{ .Values.redis.port | default 6379 }}"
            - name: DEFAULT_CURRENCY
              value: "{{ .Values.localization.defaultCurrency }}"
            - name: SITE_ID
              value: "{{ .Values.siteId }}"
            - name: SITE_BASEHOST
              value: "{{ .Values.domain | default "fbird.men" }}"
            - name: GCS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: firebird-storage-secret
                  key: gcs-key-id
                  optional: true
            - name: GCS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: firebird-storage-secret
                  key: gcs-key-secret
                  optional: true
            - name: RESEND_KEY
              valueFrom:
                secretKeyRef:
                  name: firebird-storage-secret
                  key: resend-key
                  optional: true
          volumeMounts:
            - name: webroot-shared
              mountPath: /var/www/html
            {{- if .Values.persistence.enabled }}
            - name: config-persistent
              mountPath: /var/www/html/include/config
            {{- end }}
            {{- if .Values.uploads.enabled }}
            - name: uploads-persistent
              mountPath: /var/www/html/uploads
            {{- end }}
            {{- if and .Values.configOverrides (and .Values.configOverrides.enabled .Values.configOverrides.files) }}
            - name: config-overrides
              mountPath: /etc/firebird-configs
              readOnly: true
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        # Container 2: Nginx 静态文件与反向代理 Sidecar (挂载共享 webroot 直读 CSS/JS/图片)
        - name: nginx
          image: "{{ .Values.nginxImage.repository }}:{{ .Values.nginxImage.tag }}"
          imagePullPolicy: {{ .Values.nginxImage.pullPolicy }}
          ports:
            - containerPort: 80
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3 && /usr/sbin/nginx -s quit"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: webroot-shared
              mountPath: /var/www/html
            {{- if .Values.uploads.enabled }}
            - name: uploads-persistent
              mountPath: /var/www/html/uploads
              readOnly: true
            {{- end }}
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: webroot-shared
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: firebird-nginx-{{ .Values.siteId }}
        {{- if .Values.persistence.enabled }}
        - name: config-persistent
          persistentVolumeClaim:
            claimName: firebird-config-{{ .Values.siteId }}
        {{- end }}
        {{- if .Values.uploads.enabled }}
        - name: uploads-persistent
          persistentVolumeClaim:
            claimName: firebird-uploads-{{ .Values.siteId }}
        {{- end }}
        {{- if and .Values.configOverrides (and .Values.configOverrides.enabled .Values.configOverrides.files) }}
        - name: config-overrides
          configMap:
            name: firebird-configs-{{ .Values.siteId }}
        {{- end }}
