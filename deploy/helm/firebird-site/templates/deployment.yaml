apiVersion: apps/v1
kind: Deployment
metadata:
  name: firebird-{{ .Values.siteId }}
  labels:
    app: firebird-site
    site: {{ .Values.siteId }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: firebird-site
      site: {{ .Values.siteId }}
  template:
    metadata:
      labels:
        app: firebird-site
        site: {{ .Values.siteId }}
    spec:
      containers:
        # Container 1: PHP-FPM 处理引擎
        - name: php-fpm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              value: "{{ .Values.database.host }}"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"
            - name: DEFAULT_CURRENCY
              value: "{{ .Values.localization.defaultCurrency }}"
            - name: SITE_ID
              value: "{{ .Values.siteId }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        # Container 2: Nginx 静态文件与反向代理 Sidecar
        - name: nginx
          image: "{{ .Values.nginxImage.repository }}:{{ .Values.nginxImage.tag }}"
          imagePullPolicy: {{ .Values.nginxImage.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: nginx-conf
          configMap:
            name: firebird-nginx-{{ .Values.siteId }}
