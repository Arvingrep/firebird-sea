{{- if .Values.database.createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.passwordSecretRef | default "firebird-db-secret" }}
  labels:
    app: firebird-site
    site: {{ .Values.siteId }}
type: Opaque
stringData:
  password: {{ .Values.database.password | default "firebirdpassword" | quote }}
{{- end }}
