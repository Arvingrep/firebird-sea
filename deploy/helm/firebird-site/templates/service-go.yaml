{{- if .Values.go.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: firebird-go-{{ .Values.siteId }}
  labels:
    app: firebird-go
    site: {{ .Values.siteId }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.go.service.port | default 80 }}
      targetPort: 8080
  selector:
    app: firebird-go
    site: {{ .Values.siteId }}
{{- end -}}
