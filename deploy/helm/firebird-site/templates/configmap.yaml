apiVersion: v1
kind: ConfigMap
metadata:
  name: firebird-nginx-{{ .Values.siteId }}
  labels:
    app: firebird-site
    site: {{ .Values.siteId }}
data:
  default.conf: |
    server {
        listen 80;
        server_name {{ range .Values.ingress.hosts }}{{ .host }} {{ end }}localhost;
        root /var/www/html;
        index index.php index.html;

        # 东南亚高延迟连接优化
        keepalive_timeout 65;
        client_max_body_size 50M;

        # 保持反向代理下的相对重定向（避免 302 Location 协议从 https 降级为 http）
        absolute_redirect off;

        # 管理后台专属子域名 (admin.* 或 *-admin.*) 自动引导至后台管理入口
        if ($host ~* (^admin\.|-admin\.)) {
            rewrite ^/$ /admin/ redirect;
        }

        # 后台外卖模块子目录防 dir 占位输出，引导至模块配置控制台
        rewrite ^/admin/waimai/?$ /admin/waimai/waimaiConfig.php permanent;

        # 容器平滑升级与就绪健康检查端点 (供 K8s Readiness/Liveness 探针，零停机不报500)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # 深度就绪端点：经 php-fpm 执行 healthz.php（配置文件齐全 + DB 可连），不引导火鸟框架
        # 供 probes.deepReadiness=true 的 readinessProbe 使用；不进访问日志
        location = /healthz.php {
            access_log off;
            fastcgi_pass {{ if .Values.split.enabled }}firebird-php-{{ .Values.siteId }}:9000{{ else }}127.0.0.1:9000{{ end }};
            fastcgi_param SCRIPT_FILENAME /var/www/html/healthz.php;
            include fastcgi_params;
            fastcgi_read_timeout 5;
        }

        # 火鸟伪静态重写
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # 静态资源缓存加速
        location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        {{- if .Values.configLock.enabled }}
        {{- if or (contains "'" .Values.configLock.message) (contains "'" .Values.configLock.messageJson) }}{{ fail "configLock.message / messageJson 不能包含单引号" }}{{ end }}
        # GitOps 配置锁：/admin/ 下 PHP 响应里，应用自己的"写入失败，请检查权限"被替换为"该配置由 Git 管理变更并发布"。
        # 同时替换 json_encode 转义形式（\uXXXX）与原文形式。php 不压缩输出，sub_filter 可直接处理。
        location ~ ^/admin/.*\.php$ {
            {{- include "firebird.nginxPhpBody" . | nindent 12 }}
            sub_filter_once off;
            sub_filter_types application/json text/html text/plain;
            sub_filter '{{ .Values.configLock.matchJson | replace "\\" "\\\\" }}' '{{ .Values.configLock.messageJson | replace "\\" "\\\\" }}';
            sub_filter '{{ .Values.configLock.matchRaw }}' '{{ .Values.configLock.message }}';
        }

        {{- end }}
        # PHP-FPM 反向代理（拆分拓扑时指向 firebird-php-<site> Service）
        location ~ \.php$ {
            {{- include "firebird.nginxPhpBody" . | nindent 12 }}
        }

        # 禁止访问敏感隐藏文件
        location ~ /\. {
            deny all;
        }
    }
