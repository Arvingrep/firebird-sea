{{- if and (.Values.autoscaling).enabled (not (and .Values.uploads.enabled (eq (.Values.uploads.accessMode | default "ReadWriteOnce") "ReadWriteOnce"))) (not (and .Values.persistence.enabled (eq (.Values.persistence.accessMode | default "ReadWriteOnce") "ReadWriteOnce"))) }}
# 需同时满足：autoscaling.enabled=true，且 uploads / 配置 PVC 都不是 RWO 卷（RWO 多 Pod 跨节点无法同时挂载）
# 多副本的前提还有：会话在 Redis（firebird-base 含 redis 扩展）、后台可写配置有唯一来源（见 docs/internal/WRITABLE_STATE.md）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firebird-hpa-{{ .Values.siteId }}
  labels:
    app: firebird-site
    site: {{ .Values.siteId }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firebird-{{ .Values.siteId }}
  minReplicas: {{ .Values.replicaCount }}
  maxReplicas: {{ mul .Values.replicaCount 3 | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
{{- end }}
{{- if and .Values.split.enabled (.Values.autoscaling).enabled (not (include "firebird.rwoPvc" .)) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firebird-hpa-php-{{ .Values.siteId }}
  labels:
    app: firebird-php
    site: {{ .Values.siteId }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firebird-php-{{ .Values.siteId }}
  minReplicas: {{ .Values.split.php.replicaCount | default .Values.replicaCount }}
  maxReplicas: {{ mul (.Values.split.php.replicaCount | default .Values.replicaCount) 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
{{- end }}
