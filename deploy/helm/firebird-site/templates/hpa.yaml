apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: firebird-hpa-{{ .Values.siteId }}
  labels:
    app: firebird-site
    site: {{ .Values.siteId }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: firebird-{{ .Values.siteId }}
  minReplicas: {{ .Values.replicaCount }}
  maxReplicas: {{ mul .Values.replicaCount 3 | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
