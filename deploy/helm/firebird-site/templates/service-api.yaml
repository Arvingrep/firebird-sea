{{- if .Values.api.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: firebird-api-{{ .Values.siteId }}
  labels:
    app: firebird-api
    site: {{ .Values.siteId }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "firebird-api-backendconfig-{{ .Values.siteId }}"}'
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.service.port | default 3000 }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: firebird-api
    site: {{ .Values.siteId }}
{{- end }}
