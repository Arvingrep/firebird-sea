{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firebird-api-{{ .Values.siteId }}
  labels:
    app: firebird-api
    site: {{ .Values.siteId }}
spec:
  replicas: {{ .Values.api.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: firebird-api
      site: {{ .Values.siteId }}
  template:
    metadata:
      labels:
        app: firebird-api
        site: {{ .Values.siteId }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: SITE_ID
              value: "{{ .Values.siteId }}"
            - name: DEFAULT_CURRENCY
              value: "{{ .Values.localization.defaultCurrency }}"
            {{- if .Values.tma.enabled }}
            # TMA 登录桥接与白名单代理（docs/internal/TMA_LOGIN_BRIDGE.md）。密钥只引用 secretName，值由运维创建
            - name: TMA_ENV
              value: "{{ .Values.tma.env | default .Values.siteId }}"
            - name: FBS_GATEWAY_URL
              value: "http://firebird-{{ .Values.siteId }}:{{ .Values.service.port | default 80 }}/api/fbs/index.php"
            - name: FB_UPSTREAM_URL
              value: "http://firebird-{{ .Values.siteId }}:{{ .Values.service.port | default 80 }}/include/ajax.php"
            - name: TRUST_PROXY_HOPS
              value: "{{ .Values.tma.trustProxyHops | default 1 }}"
            - name: CORS_ORIGINS
              value: "{{ range $i, $h := .Values.ingress.hosts }}{{ if $i }},{{ end }}https://{{ $h.host }}{{ end }}"
            - name: DB_HOST
              value: "{{ .Values.database.host }}"
            - name: DB_PORT
              value: "{{ .Values.database.port | default 3306 }}"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            - name: DB_USER
              value: "{{ .Values.database.user | default "firebird_user" }}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecretRef | default "firebird-db-secret" }}
                  key: {{ .Values.database.passwordSecretKey | default "password" }}
            {{- range $name := list "TMA_TOKEN_SECRET" "FBS_GATEWAY_SECRET" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.api.secretRef | default "firebird-api-secret" }}
                  key: {{ $name }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- with .Values.api.callTestUrl }}
            - name: CALL_TEST_URL
              value: {{ . | quote }}
            {{- end }}
            {{- range $name := list "TELEGRAM_BOT_TOKEN" "COINS_PH_API_KEY" "COINS_PH_API_SECRET" "TRON_MASTER_RECEIVE_ADDRESS" "TRONGRID_API_KEY" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.api.secretRef | default "firebird-api-secret" }}
                  key: {{ $name }}
                  optional: {{ ne $name "TELEGRAM_BOT_TOKEN" | and (ne $name "TRON_MASTER_RECEIVE_ADDRESS") }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
