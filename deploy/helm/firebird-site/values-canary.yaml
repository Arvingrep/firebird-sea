# ========================================================
# 🐤 火鸟金丝雀 / 预发布验证分站 (Site Copy: Canary Preview)
# 职责: 开发验收、Agent流程测试通过后，再晋升上线生产
# ========================================================

siteId: "canary"
siteName: "Firebird Canary Preview"
domain: "canary.fbird.men"

replicaCount: 2

ingress:
  hosts:
    - host: "canary.fbird.men"
    - host: "canary-admin.fbird.men"
    - host: "demo.fbird.men"
    - host: "demo-admin.fbird.men"

# 数据库配置: 独立隔离的金丝雀验证数据库，避免测试数据污染生产
database:
  name: "firebird_canary"
  createSecret: false

localization:
  defaultCurrency: "PHP"
  currencySymbol: "₱"
  timezone: "Asia/Manila"
  phonePrefix: "+63"
  defaultLang: "en-US"

# 金丝雀验收自动化通知
deployNotify:
  webhook: "http://n8n.n8n.svc.cluster.local:5678/webhook/firebird-agent-event"

# AD-20 先行验证站：跳过 FileDataCache SQL 结果缓存，配置类 SELECT 直查 DB。
# 背景：缓存 TTL=0 且全仓库无失效调用，多副本下后台改 site_module/site_payment 后
# 各 Pod 永不收敛（sweeper 只清本地文件）。打开后一致性恢复，DB 点查增量在 canary 实测。
fileCache:
  queryBypass: true

# 最低可用 Pod 数为 1，确保更新与升级时绝不报 500
pdb:
  enabled: true
  minAvailable: 1

# 持久化存储与丝滑过渡引擎 (配置专属 PVC)
persistence:
  enabled: false

# 附件走 GCS（siteConfig ftpType=3 + firebird-storage-secret），本地 uploads/ 只是上传中转，不再需要 PVC。
# 2026-10-10 核查：canary PVC 0 文件、manila PVC 0MiB/11 inodes（均为空），无需迁移。
# 去 PVC 后：Deployment 自动 RollingUpdate(maxUnavailable=0)，发版/节点轮换不再整站不可用。
# 如需恢复本地附件持久化：uploads.enabled=true（RWO → 回到 Recreate 且单副本）。
uploads:
  enabled: false

# P0/P2 先行验证站：nginx 静态镜像 (firebird-nginx:latest) + 深度就绪探针
# 通过后再逐站（manila → cebu）把 webroot.mode / probes.deepReadiness 打开
webroot:
  mode: baked

probes:
  deepReadiness: true

# GitOps 配置锁：先在 canary 验证（后台保存配置会被拒绝并提示"该配置由 Git 管理变更并发布"）。
# 通过后再给 manila：确认运营日常要在后台改的项都已纳入 configVars / Git。
configLock:
  enabled: true

# 镜像 tag 由 CI 构建成功后写回为不可变 `canary-<sha12>`（ci-gke.yml 步骤 5），
# 不要手工改回浮动 `canary`：ArgoCD 只在 git manifest 变化时同步，浮动 tag 会让
# 「同步时刻」与「镜像就绪时刻」脱钩 —— 2026-11-07 骑手入口 404 就是这么来的。
#
# ⚠️ firebird-canary 这个 ArgoCD Application 还有一组 spec.source.helm.parameters，
# 把 image.tag / api.image.tag 静态覆盖成固定 sha（Helm 参数优先于 values 文件），
# 所以这两个键写回也不生效；本文件真正管用的是 api.goImage.tag 与 tgBot.image.tag
# —— 事故时线上正是这两个还挂着浮动 tag（firebird-api-go:canary / tg-bot:canary）。
# 那组 parameters 若被清掉，四个键会一起由本文件接管。
# 也不能用 latest：main 的生产构建同样推 latest，会让验收站吃到未验收的镜像。
image:
  tag: "canary-3a50e917ab56"
api:
  # 引擎已切 go。四条骑手路由全部移植并对拍通过，notYetInCode 已清空（0 条待移植）。
  #
  # 切换前的三项核对，逐条留痕：
  #   1. httpapi.Routes() 共 27 条，骑手线 4 条齐（GET/POST /rider/bind、
  #      POST /rider/session、POST /internal/dispatch）；contract 双向核对绿；
  #   2. rider-route.test.js / dispatch-route.test.js 的用例逐条译成 Go 测试，
  #      25 个包全 ok，rider/dispatch/httpapi/cmd 四包过 -race；
  #   3. 迁移在两条路径上都验过（API 进程启动时会自己跑迁移，main.go 第 3 步）：
  #      存量库（Node 已迁出 8 条记录）→ 启动日志 applied=[] count=0，006/008 两条
  #      非幂等 ALTER 被正确跳过；空库 → applied 8 条、18 张表，健康检查与骑手路由均 200。
  #
  # 回滚：把下面一行改回 node 即可，Node 版原样保留在 services/api，两个镜像照常构建。
  engine: go
  image:
    tag: "canary-3a50e917ab56"
  # Go 镜像由 CI 的 firebird-api-go 段按同一套 tag 策略推送（canary / canary-<sha12>）。
  # engine=node 时这个 tag 不被使用，但镜像照常构建——切引擎时不必等一次 CI。
  goImage:
    tag: "canary-3a50e917ab56"
  goCompat:
    enabled: true

# 验证站托管 tg-bot（长轮询，replicas 恒 1）。
# 开启前确认无其他实例（本机 compose / 另一台机器）在轮询同一 token，否则 getUpdates 会 409、
# 机器人随机不响应。manila / cebu / 默认 values 保持 false —— 同一 token 只允许一个 poller。
tgBot:
  enabled: true
  image:
    tag: "canary-3a50e917ab56"

# TG 登录：gateway.url 留空即取 http://firebird-canary:80（集群内直连 nginx Service）。
# web_app 按钮指向本验证站的对外域名；Telegram 只接受 https。
tgApp:
  baseUrl: "https://canary.fbird.men"

# 网关 cookieDomain 兜底（FBS_GATEWAY_COOKIE_DOMAIN → php-fpm）。
# 必须与下面 tma.bridge.cookieDomain 同值：这是跨域登录态的唯一依据，两处不一致会种出两份不同域的 cookie。
# 为什么需要：baked 模式 data/ 是 emptyDir，Pod 重建后 data/cache/config.php 消失；且新版火鸟已移除
# cookieDomain 自定义，缓存里永远不会有 $cfg_cookieDomain → 只认缓存必然 500 CONFIG_MISSING（KI 见报告）。
gateway:
  cookieDomain: "fbird.men"

# Telegram Mini App 登录桥接与白名单代理：仅 canary 启用（prod 晋升时另建独立密钥并单独 PR）。
# 前置：TMA_TOKEN_SECRET / FBS_GATEWAY_SECRET 已在集群 firebird-api-secret 中创建；revert 本提交即回滚。
tma:
  # 2026-11-06 关闭（裁决人 team-lead，复核人 Vic）：合并后 canary 旧 Node 登录链
  # （memberMap/credentialProvider/bridgeRoute → /tg-api/auth/telegram|bridge）与本仓库 PHP 网关
  # 契约四层不一致（键名 / 响应包裹 / 错误语义 / 缺 ttl），该链仓内零调用方（旧 TMA 应用已归档），
  # 本轮验收先关；契约收敛见 KI-005。重新启用只需把 false 改回 true，bridge 各字段保持原样。
  # （2026-11-06 修复轮 4 更新：KI-005「临时措施」的 chart 修正在 canary 已落地——
  # DB_* / TRUST_PROXY_HOPS / CORS_ORIGINS 已移出 `if .Values.tma.enabled` 守卫，
  # 实测 enabled=false 照常渲染，不再有「关桥连坐数据库配置」的部署前提。）
  enabled: false
  # 登录桥（TAPD 0002）：Cookie 落在父域，canary.fbird.men 与 www.fbird.men 共用一份会话，
  # 与火鸟 $cfg_cookieDomain 口径一致；有效期需与火鸟后台在线时长对齐（M-2）。
  bridge:
    cookieDomain: "fbird.men"
    cookieMaxAge: 86400
    targetDefault: "/"
    forceSecure: true

# 模块入口统一为「子目录」（customSubDomain=2）。
# 路径 → DB 写入见 scripts/fix_module_domain_aliases.sql；
# PHP 配置文件由此处的 configVars 在 Pod 启动时覆盖（apply-config-vars.php）。
# 根因：seed_module_domains.php 的「非空即 skip」逻辑导致 domain 别名未从
#   article→article/shop→shop/… 更新为 news/shop/zhuang/baokan/jianzhan；
#   同时 shop/renovation/paper/website 的 state=1（offline）需一并恢复。
configVars:
  article.inc.php:
    customSubDomain: 2
  shop.inc.php:
    customSubDomain: 2
  renovation.inc.php:
    customSubDomain: 2
  paper.inc.php:
    customSubDomain: 2
  website.inc.php:
    customSubDomain: 2
  info.inc.php:
    customSubDomain: 2
  job.inc.php:
    customSubDomain: 2
  car.inc.php:
    customSubDomain: 2
  special.inc.php:
    customSubDomain: 2
  quanjing.inc.php:
    customSubDomain: 2
  business.inc.php:
    customSubDomain: 2

# 冒烟覆盖模块入口（PostSync Job）。
# /fenlei = info 模块子目录别名（与 fix_module_domain_aliases.sql 一致）。
# api: 另一个 PostSync Job 直连 api service 验 /tg-api（Web 服务上没有这些路径）。
# 2026-11-07 骑手入口 404 那次，Web 冒烟与 Pod Ready 全绿，缺的就是这道闸门。
smokeTest:
  api:
    enabled: true
    timeoutSeconds: 180
  paths:
    - "/"
    - "/u"
    - "/b"
    - "/supplier"
    - "/supplier/job"
    - "/member"
    - "/business"
    - "/info"
    - "/house"
    - "/job"
    - "/car"
    - "/special"
    - "/waimai"
    - "/quanjing"
    - "/shop"
    - "/news"
    - "/baokan"
    - "/jianzhan"
    - "/fenlei"
    - "/zhuang"

# PHP→Go 迁移（#234）：白名单保持空——真实流量的第一批 action 加入前须 Arvin 审批。
# /go-compat 对比入口由 api.goCompat（#231，Traefik 直连 api-go）提供，不经 nginx。
go:
  actions: []
