# ========================================================
# 🐤 火鸟金丝雀 / 预发布验证分站 (Site Copy: Canary Preview)
# 职责: 开发验收、Agent流程测试通过后，再晋升上线生产
# ========================================================

siteId: "canary"
siteName: "Firebird Canary Preview"
domain: "canary.fbird.men"

replicaCount: 2

ingress:
  hosts:
    - host: "canary.fbird.men"
    - host: "canary-admin.fbird.men"
    - host: "demo.fbird.men"
    - host: "demo-admin.fbird.men"

# 数据库配置: 独立隔离的金丝雀验证数据库，避免测试数据污染生产
database:
  name: "firebird_canary"
  createSecret: false

localization:
  defaultCurrency: "PHP"
  currencySymbol: "₱"
  timezone: "Asia/Manila"
  phonePrefix: "+63"
  defaultLang: "en-US"

# 金丝雀验收自动化通知
deployNotify:
  webhook: "http://n8n.n8n.svc.cluster.local:5678/webhook/firebird-agent-event"

# 最低可用 Pod 数为 1，确保更新与升级时绝不报 500
pdb:
  enabled: true
  minAvailable: 1

# 持久化存储与丝滑过渡引擎 (配置专属 PVC)
persistence:
  enabled: false

# 附件走 GCS（siteConfig ftpType=3 + firebird-storage-secret），本地 uploads/ 只是上传中转，不再需要 PVC。
# 2026-10-10 核查：canary PVC 0 文件、manila PVC 0MiB/11 inodes（均为空），无需迁移。
# 去 PVC 后：Deployment 自动 RollingUpdate(maxUnavailable=0)，发版/节点轮换不再整站不可用。
# 如需恢复本地附件持久化：uploads.enabled=true（RWO → 回到 Recreate 且单副本）。
uploads:
  enabled: false

# P0/P2 先行验证站：nginx 静态镜像 (firebird-nginx:latest) + 深度就绪探针
# 通过后再逐站（manila → cebu）把 webroot.mode / probes.deepReadiness 打开
webroot:
  mode: baked

probes:
  deepReadiness: true

# GitOps 配置锁：先在 canary 验证（后台保存配置会被拒绝并提示"该配置由 Git 管理变更并发布"）。
# 通过后再给 manila：确认运营日常要在后台改的项都已纳入 configVars / Git。
configLock:
  enabled: true

# 验收环境只跟随 canary 分支的构建（tag=canary，每次 push canary 覆盖）。
# 不能用 latest：main 的生产构建也会推 latest，会让验收环境吃到未经验收的镜像。
# 注意：Image Updater 只追 40 位 SHA tag，canary / canary-<sha12> 不会被它选中，不会误滚 manila。
image:
  tag: "canary"
api:
  image:
    tag: "canary"

# Telegram Mini App 登录桥接与白名单代理：仅 canary 启用（prod 晋升时另建独立密钥并单独 PR）。
# 前置：TMA_TOKEN_SECRET / FBS_GATEWAY_SECRET 已在集群 firebird-api-secret 中创建；revert 本提交即回滚。
tma:
  enabled: true
  # 登录桥（TAPD 0002）：Cookie 落在父域，canary.fbird.men 与 www.fbird.men 共用一份会话，
  # 与火鸟 $cfg_cookieDomain 口径一致；有效期需与火鸟后台在线时长对齐（M-2）。
  bridge:
    cookieDomain: "fbird.men"
    cookieMaxAge: 86400
    targetDefault: "/"
    forceSecure: true

# 模块入口统一为「子目录」（customSubDomain=2）。
# 路径 → DB 写入见 scripts/fix_module_domain_aliases.sql；
# PHP 配置文件由此处的 configVars 在 Pod 启动时覆盖（apply-config-vars.php）。
# 根因：seed_module_domains.php 的「非空即 skip」逻辑导致 domain 别名未从
#   article→article/shop→shop/… 更新为 news/shop/zhuang/baokan/jianzhan；
#   同时 shop/renovation/paper/website 的 state=1（offline）需一并恢复。
configVars:
  article.inc.php:
    customSubDomain: 2
  shop.inc.php:
    customSubDomain: 2
  renovation.inc.php:
    customSubDomain: 2
  paper.inc.php:
    customSubDomain: 2
  website.inc.php:
    customSubDomain: 2
  info.inc.php:
    customSubDomain: 2
  job.inc.php:
    customSubDomain: 2
  car.inc.php:
    customSubDomain: 2
  special.inc.php:
    customSubDomain: 2
  quanjing.inc.php:
    customSubDomain: 2
  business.inc.php:
    customSubDomain: 2

# 冒烟覆盖模块入口（PostSync Job）。
# /fenlei = info 模块子目录别名（与 fix_module_domain_aliases.sql 一致）。
smokeTest:
  paths:
    - "/"
    - "/u"
    - "/b"
    - "/supplier"
    - "/supplier/job"
    - "/member"
    - "/business"
    - "/info"
    - "/house"
    - "/job"
    - "/car"
    - "/special"
    - "/waimai"
    - "/quanjing"
    - "/shop"
    - "/news"
    - "/baokan"
    - "/jianzhan"
    - "/fenlei"
    - "/zhuang"
