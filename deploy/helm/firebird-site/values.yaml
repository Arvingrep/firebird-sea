# ========================================================
# Firebird Site Helm Values - 最小 Demo 站配置模板 (支持复制)
# ========================================================

# 站点标识 (多站点复制只需改此字段，如 manila, cebu, clark)
siteId: "demo"
siteName: "Firebird SEA Demo"
domain: "demo.fbird.men"

replicaCount: 1

image:
  repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-php"
  pullPolicy: IfNotPresent
  tag: "latest"

nginxImage:
  repository: "nginx"
  tag: "alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

# 伴生 Node.js 扩展微服务 (firebird-api)
api:
  enabled: true
  replicaCount: 1
  image:
    repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-api"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 3000
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

certificate:
  enabled: true
  name: "" # 为空则自动使用 firebird-ssl-cert-<siteId>

ingress:
  enabled: true
  className: "gce"
  globalStaticIpName: "" # 如有 GCP 全局保留静态 IP 填入名称，为空则使用动态全局 IP
  annotations:
    kubernetes.io/ingress.class: "gce"
  hosts:
    - host: "demo.fbird.men"
      paths:
        - path: /*
          pathType: ImplementationSpecific
    - host: "admin.fbird.men"
      paths:
        - path: /*
          pathType: ImplementationSpecific
    - host: "demo.fh580.net"
      paths:
        - path: /*
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

# 外部数据库连接 (集群内部 MySQL 或外部 GCP Cloud SQL)
database:
  host: "mysql.zxem.svc.cluster.local"
  port: 3306
  name: "firebird_demo"
  user: "firebird_user"
  password: "firebirdpassword"
  passwordSecretRef: "firebird-db-secret"
  passwordSecretKey: "password"
  createSecret: true

# 外部 Redis 缓存 (集群内部 Redis 或外部 GCP Memorystore)
redis:
  host: "redis.zxem.svc.cluster.local"
  port: 6379

# 本地化配置
localization:
  defaultCurrency: "PHP"
  currencySymbol: "₱"
  timezone: "Asia/Manila"
  phonePrefix: "+63"
  defaultLang: "en-US"
