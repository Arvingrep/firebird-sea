# ========================================================
# Firebird Site Helm Values - 最小 Demo 站配置模板 (支持复制)
# ========================================================

# 站点标识 (多站点复制只需改此字段，如 manila, cebu, clark)
siteId: "demo"
siteName: "Firebird SEA Demo"
domain: "demo.fbird.men"

replicaCount: 1

image:
  repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-php"
  pullPolicy: Always
  tag: "latest"

nginxImage:
  repository: "nginx"
  tag: "alpine"
  pullPolicy: IfNotPresent

# P2 webroot 供给方式（见 deployment.yaml 头部说明）
#   copy  : 旧行为。init 把整站（~1.1GB / 3.4 万文件）cp -a 到 emptyDir，每次 Pod 启动都要复制
#   baked : 代码直接来自镜像，nginx 用同 tag 的 firebird-nginx 静态镜像，仅 data/ 用 emptyDir 共享
# 切 baked 前提：firebird-nginx:<该站点当前 image.tag> 已存在于 GAR（CI 先推 nginx、后推 php）。
# 先在 canary 验证，再逐站切换；默认 copy 以保证"合并本 chart ≠ 立刻改变线上拓扑"。
webroot:
  mode: copy
  nginxImage:
    repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-nginx"
    pullPolicy: ""   # 留空则跟随 image.pullPolicy（latest tag 需要 Always）

# HPA 显式开关。默认关闭：多副本会让"后台改配置只落到某一个 Pod"、文件会话无法跨 Pod 共享，
# 这两件事不解决就不要放开（uploads 去 PVC 后 chart 不再强制单副本，所以需要这个显式闸门）。
autoscaling:
  enabled: false

# 探针
probes:
  # true：nginx readinessProbe 改走 /healthz.php（配置文件齐全 + DB 可连）。
  # 前提：运行的 php 镜像已包含 webroot/healthz.php，否则新 Pod 永远 NotReady，故默认关闭、先在 canary 验证。
  deepReadiness: false

# ArgoCD PostSync 冒烟：同步完成后真实请求页面，非 2xx/3xx 则标记发布失败（"已部署"≠"可用"）
smokeTest:
  enabled: true
  paths:
    - "/"
  timeoutSeconds: 300

service:
  type: ClusterIP
  port: 80

# 伴生 Node.js 扩展微服务 (firebird-api)
api:
  enabled: true
  replicaCount: 1
  image:
    repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-api"
    tag: "latest"
    pullPolicy: Always
  service:
    port: 3000
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Traefik IngressRoute 路由定义
ingressRoute:
  enabled: true
  entryPoints:
    - web
    - websecure

tls:
  enabled: false
  secretName: "" # 如有自定义 TLS 证书填入 Secret 名称，为空则使用 Traefik 默认证书

ingress:
  hosts:
    - host: "demo.fbird.men"
    - host: "admin.fbird.men"
    - host: "demo.fh580.net"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

# 外部数据库连接 (集群内部 MySQL 或外部 GCP Cloud SQL)
database:
  host: "mysql.zxem.svc.cluster.local"
  port: 3306
  name: "firebird_demo"
  user: "firebird_user"
  password: "firebirdpassword"
  passwordSecretRef: "firebird-db-secret"
  passwordSecretKey: "password"
  createSecret: true

# 外部 Redis 缓存 (集群内部 Redis 或外部 GCP Memorystore)
redis:
  host: "redis.zxem.svc.cluster.local"
  port: 6379

# 本地化配置
localization:
  defaultCurrency: "PHP"
  currencySymbol: "₱"
  timezone: "Asia/Manila"
  phonePrefix: "+63"
  defaultLang: "en-US"

# ArgoCD PostSync 上线通知（n8n webhook → TG）。为空则不创建钩子 Job。
deployNotify:
  webhook: ""
  # n8n Webhook Header Auth 的 token（Secret 不存在时不带头，n8n 会拒绝并在 Job 日志可见）
  tokenSecret:
    name: firebird-n8n-event-token
    key: token

# Pod 干扰预算与零中断平滑更新保护 (保证更新、节点维护时最低可用 Pod 数始终为 1)
pdb:
  enabled: true
  minAvailable: 1

# 持久化存储与丝滑过渡引擎 (解决火鸟系统把配置写在 PHP 文件中的云原生持久化问题)
persistence:
  enabled: false # 设置为 true 即可自动创建并绑定 1Gi 配置专属持久卷 PVC，管理员在 UI 修改的配置跨部署永不丢失
  storageClass: "standard-rwo"
  size: "1Gi"
  accessMode: "ReadWriteOnce"

# 商家上传图片/附件持久卷 (AD-17：Pod 重建后文件仍可访问；模板缓存/编译目录留在 emptyDir，日志输出到 stdout)
uploads:
  enabled: true
  storageClass: "standard-rwo"
  size: "10Gi"
  # RWO：Deployment 自动改 Recreate 且不渲染 HPA（单副本）；要多副本/滚动发布请改 RWX 存储类 + ReadWriteMany
  accessMode: "ReadWriteOnce"

# 声明式配置注入引擎 (通过 ConfigMap 锁定关键业务配置，启动自动热同步，无需云磁盘)
configOverrides:
  enabled: false
  files: {}
