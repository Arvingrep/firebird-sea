# ========================================================
# Firebird Site Helm Values - 最小 Demo 站配置模板 (支持复制)
# ========================================================

# 站点标识 (多站点复制只需改此字段，如 manila, cebu, clark)
siteId: "demo"
siteName: "Firebird SEA Demo"
domain: "demo.fbird.men"

replicaCount: 2

image:
  repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-php"
  pullPolicy: Always
  tag: "latest"

nginxImage:
  repository: "nginx"
  tag: "alpine"
  pullPolicy: IfNotPresent

# P2 webroot 供给方式（见 deployment.yaml 头部说明）
#   copy  : 旧行为。init 把整站（~1.1GB / 3.4 万文件）cp -a 到 emptyDir，每次 Pod 启动都要复制
#   baked : 代码直接来自镜像，nginx 用同 tag 的 firebird-nginx 静态镜像，仅 data/ 用 emptyDir 共享
# 切 baked 前提：firebird-nginx:<该站点当前 image.tag> 已存在于 GAR（CI 先推 nginx、后推 php）。
# 先在 canary 验证，再逐站切换；默认 copy 以保证"合并本 chart ≠ 立刻改变线上拓扑"。
webroot:
  mode: copy
  nginxImage:
    repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-nginx"
    pullPolicy: ""   # 留空则跟随 image.pullPolicy（latest tag 需要 Always）

# HPA 显式开关。默认关闭：多副本会让"后台改配置只落到某一个 Pod"、文件会话无法跨 Pod 共享，
# 这两件事不解决就不要放开（uploads 去 PVC 后 chart 不再强制单副本，所以需要这个显式闸门）。
autoscaling:
  enabled: false

# ① file_data 缓存清扫。FileDataCache 缓存配置类表的 SQL 结果，TTL=0 永不过期，且没有任何清理路径
# （后台"清除缓存"只删 data/cache 根目录的 *.json）。sidecar 按 mtime 清扫，使跨 Pod 陈旧时间有界。
fileCache:
  sweeper:
    enabled: true
    maxAgeMinutes: 5
    intervalSeconds: 60

# ② 应用层内存缓存（$HN_memory：多语言包等）声明式指向 Redis。
# 原先只能在后台"站点缓存"页保存，写进 dbinfo.inc.php，而 entrypoint 每次启动都会重写该文件 → 设置必丢。
# 需要 firebird-base:7.4-r2（含 redis 扩展）；扩展缺失时 memory 层自动禁用，不影响站点。
memoryCache:
  redis:
    enabled: false
    db: 1

# ③ 声明式配置变量：Git 为准、每次 Pod 启动施加，所有副本一致。形如 { "<file>.inc.php": { <var>: <value> } }。
# 后台页面保存会整文件重写，保存后到下次重启前这些键可能与 Git 不一致（见 docs/internal/WRITABLE_STATE.md）。
# 当前值取自 waimai.inc.php.example 的出厂默认（不改变线上行为）。
# ⚠ PRD 要求平台抽餐费从 18% 调为 0%、并确认配送费分成 89% 的含义——需业务决策后在此修改（改 Git + 发布）。
configVars:
  waimai.inc.php:
    custom_fencheng_foodprice: 18
    custom_fencheng_delivery: 89
    custom_fencheng_addservice: 100
    custom_fencheng_zsb: 100
    custom_fencheng_dabao: 100
    custom_fencheng_discount: 0
    custom_fencheng_promotion: 0
    custom_fencheng_firstdiscount: 0
    custom_fencheng_quan: 0

# 配置备份：每次发布时把当时生效的 ConfigMap 内容上传到 GCS。bucket 留空则不创建钩子。
# 必须是私有桶（uploads 桶公开读）；凭据复用 firebird-storage-secret 的 HMAC key。
configBackup:
  enabled: true
  bucket: ""
  prefix: "config-backup"
  failOnError: false

# GitOps 配置锁（默认关闭，先在 canary 验证）。
# 真源在 Git：镜像里的 include/config/*.inc.php + configVars + configOverrides；后台页面不能再改。
#  - 强制：entrypoint 把 include/config 与 dbinfo.inc.php 置为 root 只读，www-data 无法写入/重命名
#  - 提示：后台 48 个保存入口失败时统一报「写入文件 … 失败，请检查权限！」，nginx 把这句话替换成下面的 message
# 例外：writable 里的文件名保持可写（例如确认有运行期写入的文件）。
# 注意：admin/siteConfig/elasticSearch.php 写失败时不报错（厂商代码），页面会显示"成功"但实际未保存。
configLock:
  enabled: false
  writable: []
  # message（原文）与 messageJson（\uXXXX 转义）必须一致：应用用 json_encode 输出错误，默认转义非 ASCII。
  # 转义串必须用 YAML 单引号，双引号会把 \uXXXX 解码回汉字
  matchRaw: "失败，请检查权限！"
  matchJson: '\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u6743\u9650\uff01'
  message: "失败：该配置由 Git 管理变更并发布。"
  messageJson: '\u5931\u8d25\uff1a\u8be5\u914d\u7f6e\u7531 Git \u7ba1\u7406\u53d8\u66f4\u5e76\u53d1\u5e03\u3002'

# ⑤ nginx 与 php-fpm 拆成两个 Deployment，nginx 经 Service 直连 php-fpm（FastCGI :9000）。
# 要求 webroot.mode=baked 且 uploads/配置 PVC 不为 RWO（模板里 fail 强制）。
split:
  enabled: false
  php:
    replicaCount: 0      # 0 = 跟随 replicaCount
  nginx:
    replicaCount: 0
    resources: {}

# 探针
probes:
  # true：nginx readinessProbe 改走 /healthz.php（配置文件齐全 + DB 可连）。
  # 前提：运行的 php 镜像已包含 webroot/healthz.php，否则新 Pod 永远 NotReady，故默认关闭、先在 canary 验证。
  deepReadiness: false

# ArgoCD PostSync 冒烟：同步完成后真实请求页面，非 2xx/3xx 则标记发布失败（"已部署"≠"可用"）
smokeTest:
  enabled: true
  paths:
    - "/"
  timeoutSeconds: 300

service:
  type: ClusterIP
  port: 80

# 伴生 Node.js 扩展微服务 (firebird-api)
api:
  enabled: true
  replicaCount: 2
  image:
    repository: "asia-southeast1-docker.pkg.dev/fh580-70533/containers/firebird-api"
    tag: "latest"
    pullPolicy: Always
  service:
    port: 3000
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

# Traefik IngressRoute 路由定义
ingressRoute:
  enabled: true
  sticky:
    enabled: true
  entryPoints:
    - web
    - websecure

tls:
  enabled: false
  secretName: "" # 如有自定义 TLS 证书填入 Secret 名称，为空则使用 Traefik 默认证书

ingress:
  hosts:
    - host: "demo.fbird.men"
    - host: "admin.fbird.men"
    - host: "demo.fh580.net"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

# 外部数据库连接 (集群内部 MySQL 或外部 GCP Cloud SQL)
database:
  host: "mysql.zxem.svc.cluster.local"
  port: 3306
  name: "firebird_demo"
  user: "firebird_user"
  password: "firebirdpassword"
  passwordSecretRef: "firebird-db-secret"
  passwordSecretKey: "password"
  createSecret: true

# 外部 Redis 缓存 (集群内部 Redis 或外部 GCP Memorystore)
redis:
  host: "redis.zxem.svc.cluster.local"
  port: 6379

# 本地化配置
localization:
  defaultCurrency: "PHP"
  currencySymbol: "₱"
  timezone: "Asia/Manila"
  phonePrefix: "+63"
  defaultLang: "en-US"

# ArgoCD PostSync 上线通知（n8n webhook → TG）。为空则不创建钩子 Job。
deployNotify:
  webhook: ""
  # n8n Webhook Header Auth 的 token（Secret 不存在时不带头，n8n 会拒绝并在 Job 日志可见）
  tokenSecret:
    name: firebird-n8n-event-token
    key: token

# Pod 干扰预算与零中断平滑更新保护 (保证更新、节点维护时最低可用 Pod 数始终为 1)
pdb:
  enabled: true
  minAvailable: 1

# 持久化存储与丝滑过渡引擎 (解决火鸟系统把配置写在 PHP 文件中的云原生持久化问题)
persistence:
  enabled: false # 设置为 true 即可自动创建并绑定 1Gi 配置专属持久卷 PVC，管理员在 UI 修改的配置跨部署永不丢失
  storageClass: "standard-rwo"
  size: "1Gi"
  accessMode: "ReadWriteOnce"

# 商家上传图片/附件持久卷 (AD-17：Pod 重建后文件仍可访问；模板缓存/编译目录留在 emptyDir，日志输出到 stdout)
uploads:
  enabled: true
  storageClass: "standard-rwo"
  size: "10Gi"
  # RWO：Deployment 自动改 Recreate 且不渲染 HPA（单副本）；要多副本/滚动发布请改 RWX 存储类 + ReadWriteMany
  accessMode: "ReadWriteOnce"

# 声明式配置注入引擎 (通过 ConfigMap 锁定关键业务配置，启动自动热同步，无需云磁盘)
configOverrides:
  enabled: false
  files: {}
