# ========================================================
# 菲律宾大都会分站配置 (Site Copy: Manila)
# ========================================================

siteId: "manila"
siteName: "Firebird Metro Manila"
domain: "manila.fbird.men"

replicaCount: 1

ingress:
  hosts:
    - host: "manila.fbird.men"
    - host: "admin.fbird.men"
    - host: "fbird.men"
    - host: "manila.fh580.net"

database:
  name: "firebird_manila"

localization:
  defaultCurrency: "PHP"
  currencySymbol: "₱"
  timezone: "Asia/Manila"
  phonePrefix: "+63"
  defaultLang: "en-US"

# 上线闭环通知：同集群内直连 n8n（工作流「多Agent流水线事件推送TG」）
deployNotify:
  webhook: "http://n8n.n8n.svc.cluster.local:5678/webhook/firebird-agent-event"
