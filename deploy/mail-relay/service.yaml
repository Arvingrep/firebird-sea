apiVersion: v1
kind: Service
metadata:
  name: firebird-mail
  labels:
    app: firebird-mail
    app.kubernetes.io/part-of: firebird-sea
spec:
  type: ClusterIP
  selector:
    app: firebird-mail
  ports:
    - name: smtp-sub
      port: 587
      targetPort: 587
    - name: smtps
      port: 465
      targetPort: 465
    - name: smtp-plain
      port: 25
      targetPort: 25
