# ArgoCD Application：邮件中继
#
# 收进 GitOps 的原因（2026-10-27 审计 P0-4）：
# 该服务此前是手工 `kubectl apply` 的，ArgoCD 不跟踪 → selfHeal 管不到、
# 无审计记录、与仓库状态可能静默漂移。纳入后「集群状态 = Git 状态 + Secret」。
#
# Bootstrap（只需一次，之后由 ArgoCD 自管）：
#   kubectl --context mac-mini-orbstack apply -f deploy/argocd/firebird-mail.yaml
#
# 注意：清单里没有任何凭据。Secret（firebird-mail-secrets / firebird-mail-tls）
# 在集群侧创建、不纳入 Git，因此 ArgoCD 的 prune 不会碰它们。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firebird-mail
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: firebird-sea
    app.kubernetes.io/component: mail-relay
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:Arvingrep/firebird-sea.git
    targetRevision: main
    path: deploy/mail-relay
  destination:
    name: gcp-gke
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
