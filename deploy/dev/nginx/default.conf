server {
    listen 80;
    listen 443 ssl;
    server_name localhost fbird.men *.fbird.men fh580.net *.fh580.net 127.0.0.1;
    root /var/www/html/webroot;
    index index.php index.html index.htm;

    ssl_certificate /etc/nginx/ssl/fh580.crt;
    ssl_certificate_key /etc/nginx/ssl/fh580.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    # 静态资源缓存策略与跨域头允许
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf)$ {
        add_header Access-Control-Allow-Origin *;
        expires 30d;
        access_log off;
    }

    # 火鸟门户伪静态规则
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM 解析通道
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M \n memory_limit=512M \n max_execution_time=300";
        fastcgi_read_timeout 300;
        include fastcgi_params;
        fastcgi_param HTTP_HOST fh580.net;
    }

    # 禁止访问敏感文件及目录
    location ~* /(\.git|\.env|\.agents|docker|license)/ {
        deny all;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
