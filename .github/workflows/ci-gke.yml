name: "CI: Build & Push to GAR (ArgoCD 负责部署)"

on:
  push:
    branches: [ main ]
    # 纯文档/任务/看板变更不产出新镜像（否则 Image Updater 会滚动一次无意义发布）
    paths-ignore:
      - 'docs/**'
      - '.agents/**'
      - 'apps/bmad-dashboard/**'
      - 'automation/n8n/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      site_target:
        description: '选择部署的分站 (canary / manila / cebu / demo)'
        required: true
        default: 'canary'

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. 执行一人 AI 团队质量与文档卡点 (Gate)
        run: |
          chmod +x scripts/verify-task.sh
          ./scripts/verify-task.sh

      - name: 2. 检查 Helm 语法与模板渲染
        run: |
          helm lint deploy/helm/firebird-site
          helm template test-demo deploy/helm/firebird-site -f deploy/helm/firebird-site/values.yaml > /dev/null

  build-and-push:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write # 必须具备此权限，GitHub Actions 才能将 Docker 构建缓存持久化至 Caches 页面
    steps:
      - uses: actions/checkout@v4

      - name: 1. 登录 Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 2. 配置 Docker 认证 Google Artifact Registry (GAR)
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: 3. 初始化 Docker Buildx 缓存加速引擎
        uses: docker/setup-buildx-action@v3

      - name: 4. 构建并推送镜像至 Google Artifact Registry (GAR)
        run: |
          GCP_PROJECT="${{ vars.GCP_PROJECT_ID || 'fh580-70533' }}"
          BASE_IMAGE="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-base:7.4"
          IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:${{ github.sha }}"
          IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:latest"
          API_IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:${{ github.sha }}"
          API_IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:latest"

          # 4.1 检查/构建基础运行镜像 (firebird-base)
          if ! docker manifest inspect "$BASE_IMAGE" > /dev/null 2>&1; then
            echo "📦 Base 镜像不存在，正在构建并发布不可变底层基座: $BASE_IMAGE ..."
            docker buildx build --push \
              --platform linux/amd64 \
              --cache-from type=gha,scope=firebird-base \
              --cache-from type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-base:buildcache" \
              --cache-to type=gha,mode=max,scope=firebird-base \
              --cache-to type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-base:buildcache",mode=max \
              -t "$BASE_IMAGE" -f deploy/docker/Dockerfile.base .
          else
            echo "✅ 基础镜像已就绪，秒级跳过底层编译: $BASE_IMAGE"
          fi

          # 4.2 构建极速业务 Web 镜像 (继承 base，仅 COPY 源码，搭配 GHA + GAR 远端缓存)
          echo "🚀 构建业务 Web 镜像: $IMAGE_TAG ..."
          docker buildx build --push \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --cache-from type=gha,scope=firebird-php \
            --cache-from type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:buildcache" \
            --cache-from "$IMAGE_LATEST" \
            --cache-to type=gha,mode=max,scope=firebird-php \
            --cache-to type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:buildcache",mode=max \
            -t "$IMAGE_TAG" -t "$IMAGE_LATEST" -f deploy/docker/Dockerfile.web .

          # 4.3 构建业务 API 镜像 (搭配 GHA + GAR 远端缓存)
          echo "🚀 构建业务 API 镜像: $API_IMAGE_TAG ..."
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha,scope=firebird-api \
            --cache-from type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:buildcache" \
            --cache-from "$API_IMAGE_LATEST" \
            --cache-to type=gha,mode=max,scope=firebird-api \
            --cache-to type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:buildcache",mode=max \
            -t "$API_IMAGE_TAG" -t "$API_IMAGE_LATEST" -f deploy/docker/Dockerfile.api .


  # 独立通知 job：任一前置 job 失败（含 test-and-verify 被跳过构建）都能发出告警
  notify:
    needs: [test-and-verify, build-and-push]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/agent
      - name: 通知 n8n（→ TG）
        env:
          N8N_AGENT_EVENT_WEBHOOK: ${{ vars.N8N_AGENT_EVENT_WEBHOOK }}
          N8N_AGENT_EVENT_TOKEN: ${{ secrets.N8N_AGENT_EVENT_TOKEN }}
          SHA: ${{ github.sha }}
          VERIFY: ${{ needs.test-and-verify.result }}
          BUILD: ${{ needs.build-and-push.result }}
        run: |
          source scripts/agent/lib.sh
          if [ "$BUILD" = "success" ]; then
            notify image_pushed "GAR 镜像已推送 ${SHA:0:8}，Image Updater ≤2 分钟内发现并由 ArgoCD 同步上线"
          else
            notify deploy_failed "main ${SHA:0:8} 未上线：verify=${VERIFY} build=${BUILD}"
          fi
