name: CI/CD to GKE (Multi-Site Copy Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      site_target:
        description: '选择部署的分站 (demo / manila / cebu)'
        required: true
        default: 'demo'

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. 执行一人 AI 团队质量与文档卡点 (Gate)
        run: |
          chmod +x scripts/verify-task.sh
          ./scripts/verify-task.sh

      - name: 2. 检查 Helm 语法与模板渲染
        run: |
          helm lint deploy/helm/firebird-site
          helm template test-demo deploy/helm/firebird-site -f deploy/helm/firebird-site/values.yaml > /dev/null

  build-and-deploy:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 1. 登录 Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 2. 配置 GKE 凭据
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME || 'zxem-prod-gke' }}
          location: asia-southeast1-a

      - name: 3. 配置 Docker 认证 Google Artifact Registry (GAR)
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: 4. 初始化 Docker Buildx 缓存加速引擎
        uses: docker/setup-buildx-action@v3

      - name: 5. 构建极简多阶段镜像并推送至 Google Artifact Registry (GAR)
        run: |
          GCP_PROJECT="${{ vars.GCP_PROJECT_ID || 'fh580-70533' }}"
          IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:${{ github.sha }}"
          API_IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:${{ github.sha }}"
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$IMAGE_TAG" -f deploy/docker/Dockerfile.web .
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$API_IMAGE_TAG" -f deploy/docker/Dockerfile.api .

      - name: 6. Helm 部署/更新 GKE 目标分站
        run: |
          GCP_PROJECT="${{ vars.GCP_PROJECT_ID || 'fh580-70533' }}"
          TARGET="${{ github.event.inputs.site_target || 'manila' }}"
          VALUES_FILE="deploy/helm/firebird-site/values-${TARGET}.yaml"
          if [ ! -f "$VALUES_FILE" ]; then
            VALUES_FILE="deploy/helm/firebird-site/values.yaml"
          fi
          
          echo "🚀 正在部署分站: $TARGET (配置文件: $VALUES_FILE)"
          helm upgrade --install "firebird-${TARGET}" deploy/helm/firebird-site \
            --namespace default \
            -f "$VALUES_FILE" \
            --set image.repository="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php" \
            --set image.tag="${{ github.sha }}" \
            --set api.image.repository="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api" \
            --set api.image.tag="${{ github.sha }}"

      - name: 7. 触发 Telegram 手机上线闭环通知
        if: success()
        run: |
          TARGET="${{ github.event.inputs.site_target || 'manila' }}"
          MSG="🎉 *【GKE 生产上线成功】*%0A城市分站: *${TARGET}*%0A版本 Commit: \`${{ github.sha }}\`%0A状态: *🟢 运行中*"
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi
