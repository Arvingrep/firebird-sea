name: "CI: Build & Push to GAR (ArgoCD 负责部署)"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      site_target:
        description: '选择部署的分站 (demo / manila / cebu)'
        required: true
        default: 'demo'

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. 执行一人 AI 团队质量与文档卡点 (Gate)
        run: |
          chmod +x scripts/verify-task.sh
          ./scripts/verify-task.sh

      - name: 2. 检查 Helm 语法与模板渲染
        run: |
          helm lint deploy/helm/firebird-site
          helm template test-demo deploy/helm/firebird-site -f deploy/helm/firebird-site/values.yaml > /dev/null

  build-and-push:
    needs: test-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 1. 登录 Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 2. 配置 Docker 认证 Google Artifact Registry (GAR)
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: 3. 初始化 Docker Buildx 缓存加速引擎
        uses: docker/setup-buildx-action@v3

      - name: 4. 构建并推送镜像至 Google Artifact Registry (GAR)
        run: |
          GCP_PROJECT="${{ vars.GCP_PROJECT_ID || 'fh580-70533' }}"
          IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:${{ github.sha }}"
          IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:latest"
          API_IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:${{ github.sha }}"
          API_IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:latest"
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$IMAGE_TAG" -t "$IMAGE_LATEST" -f deploy/docker/Dockerfile.web .
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "$API_IMAGE_TAG" -t "$API_IMAGE_LATEST" -f deploy/docker/Dockerfile.api .

      - name: 5. 触发 Telegram 手机通知（镜像已推送，ArgoCD 将自动同步上线）
        if: success()
        run: |
          TARGET="${{ github.event.inputs.site_target || 'manila' }}"
          MSG="📦 *【镜像已构建推送 GAR】*%0A城市分站: *${TARGET}*%0A版本 Commit: \`${{ github.sha }}\`%0A状态: *🟡 等待 ArgoCD + Image Updater 自动同步上线*"
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi
