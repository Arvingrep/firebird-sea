name: "CI: Build & Push to GAR (ArgoCD 负责部署)"

on:
  push:
    # main = 生产（SHA tag + latest，由 Image Updater 追 SHA 滚 manila）
    # canary = 验收（只推 canary / canary-<sha12>，绝不推 40 位 SHA，否则 Image Updater 会把未验收镜像滚进生产）
    branches: [ main, canary ]
    # 纯文档/任务/看板/流程变更不产出新镜像（否则 Image Updater 会滚动一次无意义发布）
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '_bmad-output/**'
      - 'apps/bmad-dashboard/**'
      - 'automation/n8n/**'
      - 'scripts/**'
      - 'Makefile'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      site_target:
        description: '选择部署的分站 (canary / manila / cebu / demo)'
        required: true
        default: 'canary'

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 1. 检查 Helm 语法与模板渲染
        run: |
          helm lint deploy/helm/firebird-site
          helm template test-demo deploy/helm/firebird-site -f deploy/helm/firebird-site/values.yaml > /dev/null

  build-and-push:
    needs: helm-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/canary'
    permissions:
      contents: read
      actions: write # 必须具备此权限，GitHub Actions 才能将 Docker 构建缓存持久化至 Caches 页面
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 1. 登录 Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 2. 配置 Docker 认证 Google Artifact Registry (GAR)
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: 3. 初始化 Docker Buildx 缓存加速引擎
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: 4. 构建并推送镜像至 Google Artifact Registry (GAR)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          GCP_PROJECT="${{ vars.GCP_PROJECT_ID || 'fh580-70533' }}"
          SHA="${{ github.sha }}"
          # 分支 → tag 策略（PRIMARY 不可变标识；ROLLING 浮动 tag，同时作 cache-from）
          if [ "${{ github.ref_name }}" = "main" ]; then
            PRIMARY="$SHA"; ROLLING="latest"
          else
            PRIMARY="canary-${SHA:0:12}"; ROLLING="canary"
          fi
          echo "分支=${{ github.ref_name }} → tag: ${PRIMARY} / ${ROLLING}"
          BASE_IMAGE="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-base:7.4-r2"
          IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:${PRIMARY}"
          IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:${ROLLING}"
          API_IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:${PRIMARY}"
          API_IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:${ROLLING}"
          TGBOT_IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-tg-bot:${PRIMARY}"
          TGBOT_IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-tg-bot:${ROLLING}"
          API_GO_IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api-go:${PRIMARY}"
          API_GO_IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api-go:${ROLLING}"

          # 4.1 检查/构建基础运行镜像 (firebird-base)
          # 注意：只在该 tag 不存在时才构建。修改 Dockerfile.base（加扩展/改 ini）后必须同步递增 tag 后缀
          # (7.4-r2 → 7.4-r3)，并同步 Dockerfile.web 的 BASE_IMAGE 默认值——否则改动永远不会生效
          # （2026-10-10 实测：旧 7.4 早于 redis 扩展加入，线上 Pod 缺 redis.so，会话一直回退为文件存储）。
          if ! docker manifest inspect "$BASE_IMAGE" > /dev/null 2>&1; then
            echo "📦 Base 镜像不存在，正在构建并发布不可变底层基座: $BASE_IMAGE ..."
            docker buildx build --push \
              --platform linux/amd64 \
              --cache-from type=gha,scope=firebird-base \
              --cache-from type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-base:buildcache" \
              --cache-to type=gha,mode=max,scope=firebird-base \
              --cache-to type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-base:buildcache",mode=max \
              -t "$BASE_IMAGE" -f deploy/docker/Dockerfile.base .
          else
            echo "✅ 基础镜像已就绪，秒级跳过底层编译: $BASE_IMAGE"
          fi

          # 4.1b 构建 nginx 静态镜像 (与 firebird-php 同 SHA tag)。
          # 必须先于 firebird-php 推送：Image Updater 只盯 firebird-php 的 tag，
          # 一旦发现新 php tag 即触发同步，此时同 tag 的 nginx 镜像必须已就绪，否则 baked 站点 ImagePullBackOff。
          NGINX_IMAGE_TAG="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-nginx:${PRIMARY}"
          NGINX_IMAGE_LATEST="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-nginx:${ROLLING}"
          echo "🚀 构建 nginx 静态镜像: $NGINX_IMAGE_TAG ..."
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha,scope=firebird-nginx \
            --cache-from "$NGINX_IMAGE_LATEST" \
            --cache-to type=gha,mode=max,scope=firebird-nginx \
            -t "$NGINX_IMAGE_TAG" -t "$NGINX_IMAGE_LATEST" -f deploy/docker/Dockerfile.nginx .

          # 4.2 构建极速业务 Web 镜像 (继承 base，仅 COPY 源码，搭配 GHA + GAR 远端缓存)
          echo "🚀 构建业务 Web 镜像: $IMAGE_TAG ..."
          docker buildx build --push \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --cache-from type=gha,scope=firebird-php \
            --cache-from type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:buildcache" \
            --cache-from "$IMAGE_LATEST" \
            --cache-to type=gha,mode=max,scope=firebird-php \
            --cache-to type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-php:buildcache",mode=max \
            -t "$IMAGE_TAG" -t "$IMAGE_LATEST" -f deploy/docker/Dockerfile.web .

          # 4.3 构建业务 API 镜像 (搭配 GHA + GAR 远端缓存)
          echo "🚀 构建业务 API 镜像: $API_IMAGE_TAG ..."
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha,scope=firebird-api \
            --cache-from type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:buildcache" \
            --cache-from "$API_IMAGE_LATEST" \
            --cache-to type=gha,mode=max,scope=firebird-api \
            --cache-to type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api:buildcache",mode=max \
            -t "$API_IMAGE_TAG" -t "$API_IMAGE_LATEST" -f deploy/docker/Dockerfile.api .

          # 4.4 构建 Go 版 API 镜像（services/api-go）
          # 与 Node 版并行存在、tag 策略完全一致（PRIMARY 不可变 / ROLLING 浮动）。
          # 为什么要独立镜像而不是替换 4.3：chart 的 api.engine 按站切换，
          # canary 先跑 Go、main 仍跑 Node，两边必须同时有新镜像可拉。
          # cache scope 用 firebird-api-go 与 Node 版隔离 —— 两种构建的层结构完全不同，
          # 混用同一个 scope 会让缓存互相挤掉。
          echo "🚀 构建 Go 版 API 镜像: $API_GO_IMAGE_TAG ..."
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha,scope=firebird-api-go \
            --cache-from type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api-go:buildcache" \
            --cache-from "$API_GO_IMAGE_LATEST" \
            --cache-to type=gha,mode=max,scope=firebird-api-go \
            --cache-to type=registry,ref="asia-southeast1-docker.pkg.dev/${GCP_PROJECT}/containers/firebird-api-go:buildcache",mode=max \
            -t "$API_GO_IMAGE_TAG" -t "$API_GO_IMAGE_LATEST" -f deploy/docker/Dockerfile.api-go .

          # 4.5 构建 Telegram Bot 镜像。
          # 曾经只在上面声明了 TGBOT_IMAGE_TAG 却从未构建 → tg-bot 代码改动永远上不了线
          # （2026-11-06 实测：加了 /rider 命令、合并进 canary 后，rollout restart 拉到的
          # 仍是 7 小时前的旧镜像，Pod 内 grep 新符号为 0）。tg-bot 无 npm 依赖，
          # Dockerfile 只 COPY 源码，构建以秒计，因此每次 push 都构建、不设条件。
          echo "🚀 构建 Telegram Bot 镜像: $TGBOT_IMAGE_TAG ..."
          docker buildx build --push \
            --platform linux/amd64 \
            --cache-from type=gha,scope=firebird-tgbot \
            --cache-from "$TGBOT_IMAGE_LATEST" \
            --cache-to type=gha,mode=max,scope=firebird-tgbot \
            -t "$TGBOT_IMAGE_TAG" -t "$TGBOT_IMAGE_LATEST" -f deploy/docker/Dockerfile.tgbot .
