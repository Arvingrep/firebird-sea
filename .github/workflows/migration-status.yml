# PR 关联的 issue 自动标「状态/待审核」；PR 关闭时撤掉。
# PR 合并进 canary 时由本工作流关闭 issue——GitHub 的 Closes #N 只在合并进默认分支（main）时生效，
# 而我们的 PR 都进 canary，不手动关的话 issue 永远开着，"依赖：#N 已关闭" 也永远不满足。
name: migration-status
on:
  pull_request:
    types: [opened, reopened, edited, closed]
permissions:
  issues: write
  pull-requests: read
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const nums = [...(pr.body || '').matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(m => Number(m[1]));
            for (const n of [...new Set(nums)]) {
              const p = { owner: context.repo.owner, repo: context.repo.repo, issue_number: n };
              if (pr.state === 'open') {
                await github.rest.issues.addLabels({ ...p, labels: ['状态/待审核'] });
                await github.rest.issues.removeLabel({ ...p, name: '状态/进行中' }).catch(() => {});
              } else {
                await github.rest.issues.removeLabel({ ...p, name: '状态/待审核' }).catch(() => {});
                if (pr.merged && pr.base.ref === 'canary') {
                  await github.rest.issues.createComment({ ...p, body: `已随 #${pr.number} 合并进 canary，自动关闭。` });
                  await github.rest.issues.update({ ...p, state: 'closed', state_reason: 'completed' });
                }
              }
            }
