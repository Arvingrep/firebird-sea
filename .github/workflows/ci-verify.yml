name: CI Verify & Quality Gate

# PR → ① 确定性门禁（GitHub 托管 runner，所有 PR）
#    → ② 独立 QA Agent（本机自托管 runner，agent/* arvino/* feature/* owner/* 分支）→ 通过即自动合并 / 打回触发返工
on:
  pull_request:
    # feature/agent PR → canary（验收）；canary → main 为晋升 PR（生产）；hotfix 可直接 → main
    branches: [ main, canary ]

permissions:
  contents: read
  pull-requests: read

jobs:
  gates:
    name: 🔒 确定性门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      - name: 门禁（分支 diff：增量 / Docs-as-Code / Zero-Dep / 密钥 / 语法 / Helm）
        env:
          GATE_REQUIRE_TOOLS: "1"
          GATE_AGENT_BRANCH: ${{ (startsWith(github.head_ref, 'agent/') || startsWith(github.head_ref, 'arvino/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'owner/')) && '1' || '0' }}
          # canary → main 的晋升 PR 汇总了已逐个过门禁的改动，不再受「增量 ≤ 1200 行」限制（其余门禁照常）
          GATE_MAX_ADDED: ${{ (github.base_ref == 'main' && github.head_ref == 'canary') && '1000000' || '1200' }}
        run: |
          command -v php >/dev/null || { echo "runner 缺少 php"; exit 1; }
          set -o pipefail
          scripts/agent/gates.sh "origin/${{ github.base_ref }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Helm 多站点模板合成
        run: ./scripts/test-helm.sh
      # 注：原来这里还有一个「Story 验收用例（测试先行）」step，调 scripts/acceptance/run.sh。
      # 该体系（BMAD 测试先行 + Story 验收）已于 2026-10-27 整体下线，脚本已归档至
      # docs/archive/retired-framework-2026-10-27.tar.gz —— 保留会让每个 PR 在第一步就红。

  # 机器验证：Dev Agent 没有 Bash，行为正确性由这里兜底。
  # 托管 ubuntu runner 自带 docker 与 PATH；verify-task.sh 内另补常见 docker 路径并在缺失时明确失败。
  # ⚠️ 下面 job 名同时是 **分支保护的必过检查名**（main 分支 required_status_checks）。
  # 改名 = 那个必过检查永远不会上报 = 所有 PR 变成 BLOCKED 且看不出原因（checks 全绿，merge 按钮灰）。
  # 改这里时必须同步改保护规则：
  #   gh api repos/Arvingrep/firebird-sea/branches/main/protection/required_status_checks \
  #     --jq '.contexts'                       # 看当前要求的名字
  # 这个漂移是隐形的：workflow 里看不到、PR 页面也不提示，只有 mergeStateStatus=BLOCKED 能暴露。
  verify-task:
    name: 🧪 verify-task（流程自测 + Node 单测 + TMA 前端 + 数据库集成测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scripts/verify-task.sh（含 apps/tma 类型检查/测试/构建；CI=true 时含真实 MySQL migration 测试）
        env:
          CI: "true"
        run: ./scripts/verify-task.sh

  agent-qa:
    name: 🛡️ 独立 QA Agent
    needs: [gates, verify-task]
    # 门禁失败也要跑：由 QA 把失败项写成打回意见，驱动 Dev Agent 返工
    if: >-
      always() &&
      (startsWith(github.head_ref, 'agent/') || startsWith(github.head_ref, 'arvino/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'owner/')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, firebird-agent]
    timeout-minutes: 30
    concurrency:
      group: agent-qa-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
      N8N_AGENT_EVENT_WEBHOOK: ${{ vars.N8N_AGENT_EVENT_WEBHOOK || '' }}
      N8N_AGENT_EVENT_TOKEN: ${{ secrets.N8N_AGENT_EVENT_TOKEN }}
      QA_AGENT_CMD: ${{ vars.QA_AGENT_CMD || '' }}
      # 默认 0：施工侧的 Dev Agent 已下线，验收侧若仍自动合并，等于「无人复核就进 canary」。
      # 需要恢复自动合并时，在仓库 Variables 里显式设 AGENT_AUTO_MERGE=1。
      AGENT_AUTO_MERGE: ${{ vars.AGENT_AUTO_MERGE || '0' }}
      # PR 的实际目标分支（canary 或 main）；脚本里所有 origin/main 均由它替换
      AGENT_BASE_BRANCH: ${{ github.base_ref }}
      AGENT_MAX_ATTEMPTS: ${{ vars.AGENT_MAX_ATTEMPTS || '3' }}
      # 托管 runner 上 gates job 的结论（含 test-helm 等全部步骤），非 success 不得合并
      # verify-task 也必须 success，否则等同门禁失败（qa.sh 无需改动）
      GATES_JOB_RESULT: ${{ (needs.gates.result == 'success' && needs.verify-task.result == 'success') && 'success' || 'failure' }}
    steps:
      # 检出 base（canary 或 main）而不是 PR：qa.sh / gates.sh / RULES 这些「裁判」必须来自 base 分支，
      # PR 代码由 qa.sh 自行检出为被审数据
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: QA 验收（通过 → squash 合并 → ci-gke 构建 → Image Updater → ArgoCD）
        run: |
          [ -n "$QA_AGENT_CMD" ] || unset QA_AGENT_CMD
          scripts/agent/qa.sh "${{ github.event.pull_request.number }}"
