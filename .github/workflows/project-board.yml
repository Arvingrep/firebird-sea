# 维护个人 Project「firebird-sea 总看板」。个人 Project 不能用 GITHUB_TOKEN 操作，
# 所以跑在 Arvin 的 MacBook（self-hosted runner: macbook-firebird）上，使用本机 gh 登录态。
# 仓库是公开的：只响应 Arvingrep 自己触发的事件，陌生人开 issue / PR 不会在这台电脑上跑任何任务。
# 本 workflow 只执行默认分支上的脚本，从不检出 PR 代码。
name: project-board
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main, canary]
    paths: ['.github/workflows/project-board.yml', '.github/scripts/project-board.sh']
  workflow_run:
    workflows: [migration-status]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-board
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      (github.event_name != 'issues' || github.event.sender.login == 'Arvingrep') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.actor.login == 'Arvingrep')
    runs-on: [self-hosted, firebird-agent]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: 同步看板
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            bash .github/scripts/project-board.sh issue "${{ github.event.issue.number }}"
          else
            bash .github/scripts/project-board.sh full
          fi
