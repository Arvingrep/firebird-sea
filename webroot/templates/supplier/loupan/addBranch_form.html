<style>
    .formBox{margin: 0 20px; padding-top: 56px; padding-bottom: 90px; }
    .formPart1{padding-left: 30px; position: relative;}
    .formPart1 .formItemBox{margin-left: 140px; padding-top: 10px;}
    .formPart1::after{content: ''; clear: both;}
    .fileUpBox{float: left; width: 120px; height: 120px; position: absolute; left: 30px; top: 0;}
    .fileUpBox #fileUp{position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0 ; cursor: pointer;}
    .fileUpBtn,.fileUpPic{width: 120px; height: 120px; background: #F5F7FA; border-radius: 4px; text-align: center; box-sizing: border-box; padding-top: 30px;  }
    .fileUpPic img{width: 100%; height: 100%; object-fit: cover;}
    .fileUpPic {padding: 0;}
    .fileUpPic .changeText{font-size: 12px; line-height: 30px; background-color: rgba(0,0,0,.5); color: #fff; position: absolute; left: 0; right: 0; bottom: 0; }
    .fileUpBtn .el-icon{font-size: 26px; text-align: center; color: #626973;}
    .fileUpBtn p{color: #666; font-size: 14px; margin-top: 8px;}
    .formBox .el-input,.formBox .el-textarea{width: 450px;}

    .formPart2{margin-top: 50px; padding-bottom: 56px;}
    .formPart2 .part_tit {height: 50px; background: #F7F9FC; border-radius: 6px; margin-bottom: 40px;}
    .formPart2 .part_tit h4{font-size: 16px; color: #333; font-weight: bold; line-height: 50px; padding: 0 20px;}
    .warntext{display: inline-block; font-size: 13px; color: #8D93A6; margin-left: 15px;}
    .formPart2 .el-textarea textarea{min-height: 100px !important; box-sizing: border-box;}
    .btn_save{margin-left: 110px; color: #fff; width: 160px; height: 46px; background: linear-gradient(90deg, #306BFF 0%, #4281FF 100%); border-radius: 6px; border: none;}
    .btn_save:hover{opacity: .9; background: linear-gradient(90deg, #306BFF 0%, #4281FF 100%); border: none;}

    .err_tip{display: inline-block; font-size: 13px; color: #1975FF; position: static;} 
    .err_tip i{font-size: 14px; margin-right: 2px;}
    .err_tip.onError{color:#FF4F38; font-size: 13px;}
    .copybtn{display: inline-block;width: 110px; height: 32px; background: linear-gradient(90deg, #1966FF 0%, #3377FF 100%); border-radius: 4px; color: #fff; font-size: 14px; padding: 0; border: none;}
    .copybtn:hover{opacity: .9; color: #fff; border: none;}
</style>
{#$rsaScript#}
<el-form class="formBox" :model="formData" ref="formData" :rules="rules_form" label-width="110px">
    <div class="formPart1 ">
        <div class="fileUpBox">
            <input type="file" id="fileUp" @change="fileChange" accept="image/*">
            <div class="fileUpBtn" v-if="!formData.logo">
                <span class="el-icon el-icon-plus"></span>
                <p>公司头像</p>
            </div>
            <div class="fileUpPic" v-else>
                <img :src="formData.logoUrl" alt="">
                <div class="changeText">重新上传</div>
            </div>
        </div>
        <div class="formItemBox">
            <el-form-item label="分销组织名称"  data-name="name"   prop="name">
                <el-input v-model="formData.name"></el-input>
                <div class="err_tip onError" v-if="error.onError && error.name == 'name'"><i class="el-icon-info"></i>请填写分销组织名称</div>
            </el-form-item>
            <el-form-item label="公司简称" data-name="shortName">
                <el-input v-model="formData.shortName"></el-input>
            </el-form-item>
        </div>
    </div>
    <div class="formPart2">
        <div class="part_tit"><h4>基本信息</h4></div>
        
        <el-form-item label="负责人" data-name="people" prop="people">
            <el-input v-model="formData.people" placeholder="请填写"></el-input>
            <div class="err_tip onError" v-if="error.onError && error.name == 'people'"><i class="el-icon-info"></i>请填写负责人名称</div>
        </el-form-item>
        {#if $dotype != 'add'#}
        <el-form-item label="登录账号">
            <el-input :value="distributorData.account" disabled></el-input>
            <div class="warnTip">
                账号如需重置密码：<span>https://ihuoniao.cn/u/security-chpassword.html</span>
            </div>
        </el-form-item>
        {#/if#}
        <el-form-item label="{#if $dotype == 'add'#}绑定手机号{#else#}联系方式{#/if#}" data-name="phone" prop="phone">
            <el-input v-model="formData.phone" placeholder="请填写" @change="checkPhone"></el-input>
            {#if $dotype == 'add'#}
            <div class="warntext" v-if="error.name != 'phone'">请正确填写，将用于账号登录</div>
            {#/if#}
            <div class="err_tip onError" v-else="error.onError && error.name == 'phone'">
                <i class="el-icon-info"></i>{{error.tip}}
                <!-- <el-button class="copybtn" v-if="error.button" @click="copyToClipboard()">复制邀请链接</el-button> -->
                <!-- 存放复制邀请链接 -->
                <!-- <div id="copyInner">111111</div> -->
            </div>

        </el-form-item>
        {#if $dotype == 'add'#}
        <el-form-item label="登录密码"   data-name="password" v-if="!error.button">
            <el-input v-model="formData.password" placeholder="默认123456"></el-input>
        </el-form-item>
        {#/if#}
        {#if $grant#}
        <el-form-item label="平台分佣比例" data-name="commission" key="commission">
            <el-input v-model="formData.commission" placeholder="请填写" style="width: 200px;">
                <template #suffix>%</template>
            </el-input>
        </el-form-item>
        <el-form-item label="平台扣税比例" data-name="tax" key="tax">
            <el-input v-model="formData.tax" placeholder="请填写" style="width: 200px;">
                <template #suffix>%</template>
            </el-input>
        </el-form-item>
        {#/if#}
        <el-form-item label="备注"  data-name="mark">
            <el-input type="textarea" v-model="formData.mark" placeholder="可添加备注，仅内部可见"></el-input>
        </el-form-item>
    </div>
    <el-button type="primary" class="btn_save" @click="submit()">{{error.button ? '确认授权' : '保存'}}</el-button>
</el-form>
