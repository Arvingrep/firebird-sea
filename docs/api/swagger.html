  // 把 /waimai/xxx 别名重写成 /include/ajax.php?service=waimai&action=xxx
  function rewrite(req) {
    const m = String(req.url).match(/^(.*?)\/(waimai|article)\/([A-Za-z0-9_]+)(\?.*)?$/);
    if (m) {
      const extra = m[4] ? '&' + m[4].slice(1) : '';
      req.url = m[1] + '/include/ajax.php?service=' + m[2] + '&action=' + m[3] + extra;
    }
    return req;
  }

  function boot(spec, source) {
    if (source === 'embedded' && location.protocol === 'file:') {
      const w = document.getElementById('fb-warn');
      w.style.display = 'block';
      w.innerHTML = '当前以 file:// 方式打开，正在使用构建时内嵌的规范快照。需要按最新 YAML 渲染时，在仓库根目录执行 ' +
        '<code>python3 -m http.server 8080</code> 后访问 <code>http://localhost:8080/docs/api/swagger.html</code>。';
    }
    SwaggerUIBundle({
      spec: spec,
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'none',
      defaultModelsExpandDepth: 0,
      displayOperationId: false,
      filter: true,
      tryItOutEnabled: false,
      requestInterceptor: rewrite,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout'
    });
  }

  // 通过 HTTP 打开时优先读取同目录下的最新 YAML
  if (location.protocol !== 'file:' && window.jsyaml) {
    fetch('./openapi-waimai-article.yaml')
      .then(r => r.ok ? r.text() : Promise.reject(r.status))
      .then(txt => boot(jsyaml.load(txt), 'yaml'))
      .catch(() => boot(EMBEDDED, 'embedded'));
  } else {
    boot(EMBEDDED, 'embedded');
  }
</script>
