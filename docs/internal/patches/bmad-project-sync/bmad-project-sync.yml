name: BMAD Project 状态同步

on:
  issues:
    types: [opened, closed, labeled]
  pull_request:
    types: [opened, closed]
  workflow_run:
    workflows: ["CI: Build & Push to GAR (ArgoCD 负责部署)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: Issue 或 PR URL
        required: true
      stage:
        description: backlog | in-progress | in-qa | ready-to-release | done
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: [self-hosted, firebird-agent]
    steps:
      - uses: actions/checkout@v4
      - name: 事件路由 → BMAD Project 字段同步
        env:
          BMAD_USE_GH_OAUTH: "1"
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          LABEL_NAME: ${{ github.event.label.name }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_STAGE: ${{ inputs.stage }}
          # workflow_run 相关
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # ── Helper: extract issue URL from a PR (via body or linked issues) ──
          find_linked_issue() {
            local pr_url="$1"
            # Try GraphQL to find closing issues
            local pr_number
            pr_number="$(echo "$pr_url" | grep -oE '[0-9]+$' || echo '')"
            if [ -n "$pr_number" ]; then
              local result
              result="$(gh api graphql -f query='
                query($owner:String!,$repo:String!,$pr:Int!) {
                  repository(owner:$owner,name:$repo) {
                    pullRequest(number:$pr) {
                      closingIssuesReferences(first:5) { nodes { url } }
                    }
                  }
                }' -f owner=Arvingrep -f repo=firebird-sea -F pr="$pr_number" 2>/dev/null || echo '')"
              if [ -n "$result" ]; then
                local issue_url
                issue_url="$(echo "$result" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[0].url // empty' 2>/dev/null || echo '')"
                [ -n "$issue_url" ] && echo "$issue_url" && return 0
              fi
            fi
            # Fallback: look for "Closes #N" or "Fixes #N" in PR body
            local body
            body="$(gh pr view "$pr_url" --json body -q .body 2>/dev/null || echo '')"
            local ref
            ref="$(echo "$body" | grep -oE '(Closes|Fixes|Resolves)[[:space:]]+#[0-9]+' | head -1 | grep -oE '[0-9]+' || echo '')"
            if [ -n "$ref" ]; then
              echo "https://github.com/Arvingrep/firebird-sea/issues/$ref"
              return 0
            fi
            return 1
          }

          # ── Helper: find and update linked issue item on the board ──
          update_linked_issue_stage() {
            local pr_url="$1"
            local stage_key="$2"
            local issue_url
            issue_url="$(find_linked_issue "$pr_url" 2>/dev/null || echo '')"
            if [ -n "$issue_url" ]; then
              node scripts/github-sync.js --set-stage "$issue_url" "$stage_key" 2>/dev/null || true
            fi
          }

          case "$EVENT_NAME:$ACTION" in
            # ── Issue opened: 全字段填充 ──
            issues:opened)
              LABELS_CSV="$(printf '%s' "$ISSUE_LABELS" | jq -r 'join(",")')"
              node scripts/github-sync.js --init-issue "$ISSUE_URL" "$LABELS_CSV"
              ;;

            # ── Issue closed → done ──
            issues:closed)
              node scripts/github-sync.js --set-stage "$ISSUE_URL" done
              ;;

            # ── Label agent:dev → 编码实现 ──
            issues:labeled)
              if [ "$LABEL_NAME" = "agent:dev" ]; then
                node scripts/github-sync.js --on-agent-dev "$ISSUE_URL"
              fi
              ;;

            # ── PR opened → 独立验收 ──
            pull_request:opened)
              node scripts/github-sync.js --set-stage "$PR_URL" in-qa
              ;;

            # ── PR closed ──
            pull_request:closed)
              if [ "$PR_MERGED" = "true" ]; then
                # 合并 → 待发布 (PR + linked issue)
                node scripts/github-sync.js --set-stage "$PR_URL" ready-to-release
                update_linked_issue_stage "$PR_URL" ready-to-release
              else
                # 未合并关闭 → 退回编码实现 + 阻塞原因 (PR + linked issue)
                REASON="PR #${PR_URL##*/} 关闭未合并"
                # Try to get the closing reason from PR
                BODY="$(gh pr view "$PR_URL" --json body -q .body 2>/dev/null || echo '')"
                if [ -n "$BODY" ]; then
                  REASON="$REASON — $(echo "$BODY" | head -3 | tr '\n' ' ' | cut -c1-200)"
                fi
                node scripts/github-sync.js --on-pr-closed-unmerged "$PR_URL" "$REASON"
                update_linked_issue_stage "$PR_URL" in-progress
              fi
              ;;

            # ── CI 部署成功（workflow_run） → 已上线闭环 ──
            workflow_run:completed)
              if [ "${WORKFLOW_RUN_CONCLUSION:-}" != "success" ]; then
                echo "CI workflow 未成功 (${WORKFLOW_RUN_CONCLUSION:-unknown})，跳过"
                exit 0
              fi
              SHA="${WORKFLOW_RUN_HEAD_SHA:-}"
              if [ -z "$SHA" ]; then
                echo "无 HEAD SHA，跳过"
                exit 0
              fi
              # 找到与此 SHA 关联的已合并 PR
              PR_INFO="$(gh pr list -R Arvingrep/firebird-sea --state merged --search "$SHA" --json number,url,body --jq 'first(.[])' 2>/dev/null || echo '')"
              COMMIT_MSG="$(gh api "repos/Arvingrep/firebird-sea/commits/$SHA" --jq '.commit.message' 2>/dev/null || echo '')"
              if [ -z "$PR_INFO" ]; then
                echo "未找到关联 PR，尝试从提交消息推断"
                PR_NUM="$(echo "$COMMIT_MSG" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' || echo '')"
                if [ -n "$PR_NUM" ]; then
                  PR_URL="https://github.com/Arvingrep/firebird-sea/pull/$PR_NUM"
                else
                  # Last resort: explicit closing keyword in commit message
                  # (bare '#N' would match the squash PR number "(#N)" — must require Closes/Fixes/Resolves)
                  ISSUE_REF="$(echo "$COMMIT_MSG" | grep -oE '(Closes|Fixes|Resolves)[[:space:]]+#[0-9]+' | head -1 | grep -oE '[0-9]+' || echo '')"
                  if [ -n "$ISSUE_REF" ]; then
                    ISSUE_URL="https://github.com/Arvingrep/firebird-sea/issues/$ISSUE_REF"
                    echo "Deploy success → direct issue ref: $ISSUE_URL"
                    node scripts/github-sync.js --on-deploy-success "$ISSUE_URL" "$ISSUE_URL"
                    exit 0
                  fi
                  echo "无法找到关联 Issue/PR，跳过"
                  exit 0
                fi
              else
                PR_URL="$(echo "$PR_INFO" | jq -r '.url')"
              fi
              # 找到 PR 关联的 Issue URL
              ISSUE_URL="$(find_linked_issue "$PR_URL" 2>/dev/null || echo '')"
              # Fallback: search commit message for direct issue refs
              if [ -z "$ISSUE_URL" ]; then
                ISSUE_REF="$(echo "$COMMIT_MSG" | grep -oE '(Closes|Fixes|Resolves)[[:space:]]+#[0-9]+' | head -1 | grep -oE '[0-9]+' || echo '')"
                [ -n "$ISSUE_REF" ] && ISSUE_URL="https://github.com/Arvingrep/firebird-sea/issues/$ISSUE_REF"
              fi
              echo "Deploy success → PR=$PR_URL Issue=$ISSUE_URL"
              node scripts/github-sync.js --on-deploy-success "$PR_URL" "${ISSUE_URL:-}"
              # Also update linked issue item on board to done
              if [ -n "$ISSUE_URL" ]; then
                node scripts/github-sync.js --set-stage "$ISSUE_URL" done 2>/dev/null || true
              fi
              ;;

            # ── Manual dispatch ──
            workflow_dispatch:*)
              node scripts/github-sync.js --set-stage "$INPUT_URL" "$INPUT_STAGE"
              ;;

            *)
              echo "未匹配事件: $EVENT_NAME:$ACTION，跳过"
              ;;
          esac
